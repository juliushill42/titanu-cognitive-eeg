name: Import audited source archive
on:
  push:
    branches: [main]
    paths: [source.tar.xz]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify archive, unpack and commit source
        shell: bash
        run: |
          set -euo pipefail
          echo "9966df7c23157f1e3fc5a12f220ccc8d29f896f8412861dcc7db93ff5e85d0b5  source.tar.xz" | sha256sum -c -
          tar -tJf source.tar.xz | grep -E '(^|/)README.md$' >/dev/null
          tar -xJf source.tar.xz -C .
          rm -f source.tar.xz .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import TitanU cognitive EEG milestone 3 source"
          git push origin HEAD:main
